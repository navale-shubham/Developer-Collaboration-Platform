[project]
name = "developer-collaboration-platform"
version = "0.1.0"
description = "A developer collaboration platform where developers can create team spaces, manage projects, tasks and collaborate with other developers."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.14.0",
    "sqlmodel>=0.0.42",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning"
]
